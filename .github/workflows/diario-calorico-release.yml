name: Build Diario Calórico APK and publish release

on:
  push:
    branches: ['claude/**']
    paths: ['diario-calorico/**', '.github/workflows/diario-calorico-release.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diario-calorico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             dist/diario-calorico-v${{ steps.version.outputs.code }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: diario-calorico-v${{ steps.version.outputs.name }}
          name: Diario Calórico v${{ steps.version.outputs.name }}
          body: |
            Build automático desde `${{ github.ref_name }}`.
            Commit: ${{ github.sha }}
          files: diario-calorico/dist/diario-calorico-v${{ steps.version.outputs.code }}.apk
          make_latest: true
