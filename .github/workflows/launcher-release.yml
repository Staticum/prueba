name: Build launcher APK and publish release

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          ./gradlew :launcher:assembleRelease \
            -PlauncherVersionCode=${{ steps.version.outputs.code }} \
            -PlauncherVersionName=${{ steps.version.outputs.name }} \
            --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp launcher/build/outputs/apk/release/launcher-release.apk \
             dist/niagara-launcher-v${{ steps.version.outputs.code }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: launcher-v${{ steps.version.outputs.code }}
          name: Launcher v${{ steps.version.outputs.name }}
          body: |
            Build automático del launcher desde `${{ github.ref_name }}`.
            Commit: ${{ github.sha }}
          files: dist/niagara-launcher-v${{ steps.version.outputs.code }}.apk
          make_latest: true
